version: v2
clean: true
plugins:
  # Los plugins de Go se ejecutan con las versiones de go.mod.
  - local: [go, run, google.golang.org/protobuf/cmd/protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, run, connectrpc.com/connect/cmd/protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  # El de TypeScript viene de web/node_modules (npm install en web/).
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
