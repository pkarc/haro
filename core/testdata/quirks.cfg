global
	log stdout format raw local0   # tabs y comentario
	tune.bufsize 32768

frontend "quoted name"
    bind ipv6@:::80 v4v6
    bind unix@/run/haproxy.sock mode 600
    http-request set-header X-Foo "valor con espacios"
    http-request set-var(txn.host) req.hdr(host),lower
    acl local src -f /etc/haproxy/allow.lst
    acl h hdr_dom(host) -i example.com
    use_backend %[req.hdr(host),lower,map(/etc/haproxy/hosts.map,def)]
