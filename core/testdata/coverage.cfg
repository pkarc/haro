# Caso de cobertura de idiomas: recorre casi todas las frases de describe.go.
global
    log stdout format raw local0 info
    log ring@buf local1
    log 10.0.0.5:514 local2
    log stderr local3
    maxconn 20000
    nbthread 4
    hard-stop-after 30s
    stats socket /run/haproxy.sock mode 660 level admin expose-fd listeners
    stats socket ipv4@127.0.0.1:9999 level user
    stats timeout 1m
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-sslv3 force-tlsv13 prefer-client-ciphers weird-opt
    ssl-default-server-options ssl-max-ver TLSv1.3 no-tlsv10
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256
    tune.ssl.cachesize 100000
    ssl-engine rdrand
    lua-load /etc/haproxy/x.lua
    description Coverage case
    mystery-global 1

userlist team
    group admins users alice
    user alice password $5$abc groups admins
    user bob insecure-password hunter2

resolvers dns
    nameserver ns1 8.8.8.8:53
    parse-resolv-conf

peers mypeers
    bind :10000
    server peer1 10.0.0.1:10000

defaults
    mode http
    maxconn 3000
    retries 3
    log global
    option httplog
    option dontlognull
    no option httpclose
    no option unknownopt
    no frobnicate
    option customthing arg
    option httpchk GET /health
    timeout connect 5s
    timeout client 30s
    timeout server 1m
    timeout http-request 10s
    timeout made-up 2s
    default-server inter 3s fall 3 rise 2 maxconn 100
    errorfile 503 /etc/haproxy/errors/503.http
    hash-type consistent

cache assets
    total-max-size 64
    process-vary on

frontend web
    bind :80
    bind :::443 v4v6 ssl crt /etc/ssl/a.pem crt-list /etc/ssl/list alpn h2,http/1.1 ssl-min-ver TLSv1.2 strict-sni verify required ca-file /etc/ssl/ca.pem accept-proxy name https
    bind quic4@:443 ssl crt /etc/ssl/a.pem alpn h3
    bind unix@/run/web.sock mode 600 user haproxy
    bind abns@web level admin
    bind fd@3 v6only transparent verify optional interface eth0 level user
    bind
    stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_cur,gpc0,unknownstore peers mypeers
    acl is_api path_beg /api
    acl is_static path_end .css .js
    acl is_host hdr(host) -i example.com
    acl is_dom hdr_dom(host) example.com
    acl has_cookie cook(session) -m found
    acl has_param urlp(id) -m found
    acl big_body req.len gt 1000
    acl many sc_conn_cur(1) ge 10
    acl lowrate src_http_req_rate lt 5
    acl local src -f /etc/haproxy/allow.lst
    acl bymap hdr(host) -M /etc/haproxy/hosts.map
    acl bylist path -f /etc/haproxy/paths.lst
    acl regex path_reg ^/v[0-9]+/
    acl tls ssl_fc
    acl alwaystrue always_true
    acl lenacl path_len gt 100
    acl ver req.ver -m str 1.1
    acl resp res.hdr(content-type) -m sub json
    acl weirdfetch my_custom_fetch(a) -m beg x
    acl weirdnofetch my_other
    acl hasvar var(txn.x) -m found
    acl envacl env(HOME) -m str /root
    acl servers_up nbsrv(web_be) lt 1
    acl authed http_auth(team)
    acl conns be_conn(web_be) gt 10
    acl fhdr req.fhdr(x-a) -m str 1
    http-request track-sc0 src table web
    http-request track-sc1 hdr(x-id)
    http-request deny deny_status 429 if many !local
    http-request deny if { src_http_req_rate gt 10 } || { path_beg /admin }
    http-request deny unless authed
    http-request allow if local
    http-request auth realm "Restricted" unless authed
    http-request tarpit
    http-request reject
    http-request silent-drop
    http-request set-header X-Forwarded-Proto https if tls
    http-request add-header X-Test 1
    http-request del-header X-Powered-By
    http-request replace-header Cookie a=(.*) b=\1
    http-request set-path /new
    http-request replace-path ^/old/(.*) /new/\1
    http-request set-uri /u
    http-request set-query a=b
    http-request set-method GET
    http-request set-var(txn.host) hdr(host),lower
    http-request unset-var(txn.host)
    http-request cache-use assets
    http-request capture req.hdr(host) len 20
    http-request set-log-level silent
    http-request use-service prometheus-exporter if { path /metrics }
    http-request wait-for-body time 5s
    http-request set-timeout client 30s
    http-request set-src hdr(x-forwarded-for)
    http-request disable-l7-retry
    http-request return status 200 content-type text/plain string ok
    http-request lua.myaction
    http-request accept
    http-request do-weird thing
    http-request do-other
    http-response set-status 200
    http-response cache-store assets
    http-response set-header Strict-Transport-Security max-age=31536000
    http-after-response set-header X-Done 1
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_ver gt 2 }
    tcp-request connection reject if { src -f /etc/haproxy/bad.lst }
    tcp-request session expect-proxy
    tcp-request other
    redirect scheme https code 301 unless tls
    redirect location https://example.com/ code 307 drop-query
    redirect prefix https://www.example.com code 999
    redirect other
    use_backend api_be if is_api
    use_backend %[req.hdr(host),lower,map(/etc/haproxy/hosts.map,def)]
    default_backend web_be
    capture request header Host len 32
    monitor-uri /healthz
    option forwardfor
    option abortonclose
    log-format "%ci:%cp"
    unique-id-format %{+X}o\ %ci

backend web_be
    balance roundrobin
    balance leastconn
    balance hdr(X-User)
    balance url_param userid
    balance weird
    balance source
    cookie SERVERID insert indirect nocache httponly secure rewrite prefix
    server a1 10.0.0.1:80 check inter 2s fastinter 1s downinter 5s rise 2 fall 3 weight 10 backup maxconn 50 maxqueue 10
    server a2 10.0.0.2:443 ssl verify none ca-file /etc/ssl/ca.pem sni str(example.com) cookie a2 send-proxy disabled
    server a3 10.0.0.3:443 ssl verify required resolvers dns init-addr last,libc slowstart 30s port 8081 addr 10.0.1.1 check-ssl agent-check on-marked-down shutdown-sessions proto h2 alpn h2 track other/s1 non-stick no-check weirdopt 5
    server-template srv 1-3 app.local:8080 check
    server-template one 2 app.local:8080
    http-check connect
    http-check send meth GET uri /health
    http-check expect status 200
    http-check expect !rstatus ^5
    http-check expect string OK
    http-check expect rstring up
    http-check expect weird
    http-check disable-on-404
    http-check other
    stick-table type string len 32 size 1m expire 1d
    option httpchk
    option httpchk HEAD /ping
    option httpchk GET /x HTTP/1.1
    retry-on all-retryable-errors
    source 10.0.0.9
    dispatch 10.0.0.10:80

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats realm "Haro Stats"
    stats auth admin:secret
    stats refresh 10s
    stats admin if LOCALHOST
    stats hide-version
    stats unknown-sub x
    user haproxy
