maxconn 100
# Configuración con errores a propósito
defaults
    mode http
    timeout connect 5s

frontend web
    bind *:443 ssl crt /etc/haproxy/certs/site.pem
    acl is_api path_beg -i /api /v2
    http-request redirect scheme https code 301 unless { ssl_fc }
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 20 }
    use_backend api if is_api !is_admin || missing_acl
    default_backend nope   # no existe

frontend sinbind
    default_backend api

backend api
    balance leastconn
    bind *:9000
    server a1 10.0.0.1:443 ssl verify none check inter 2s fall 3 rise 2 backup
    server-template web 1-5 web.local:8080 check

backend tcpbe
    mode tcp
    server t1 10.0.0.9:5432

frontend mezcla
    bind *:8080
    default_backend tcpbe

listen stats
    bind *:8404
    stats enable
    stats auth admin:cambiame
fronted oops
