# Directivas del catálogo ampliado (7.2): secciones nuevas, global, tune.*,
# subcomandos de stats, tcp-check, stick, hold, capture, compression…
global
    maxconnrate 100
    maxsessrate 200
    max-spread-checks 5s
    spread-checks 10
    unix-bind prefix /run/haproxy mode 660
    nbproc 1
    thread-groups 2
    cpu-policy performance
    ssl-provider legacy
    ssl-default-bind-curves X25519:P-256
    tune.bufsize 32768
    tune.h2.fe.max-concurrent-streams 100
    tune.quic.socket-owner connection
    tune.ssl.ocsp-update.maxdelay 3600
    external-check
    set-var proc.start int(1)
    description Balanceador principal

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    external-check command /usr/local/bin/check.sh
    srvtcpka-idle 30s
    dynamic-cookie-key s3cret

resolvers dns
    nameserver ns1 10.0.0.2:53
    hold valid 10s
    hold nx 30s
    hold timeout 5s

log-forward syslog-in
    dgram-bind 0.0.0.0:514
    log 127.0.0.1:5140 local0
    backlog 100

fcgi-app php
    docroot /var/www
    index index.php
    path-info ^(/.+)$
    set-param APP_ENV production

crt-store certs
    crt-base /etc/ssl/certs
    key-base /etc/ssl/private
    load crt site.pem key site.key

peers mypeers
    peer a 10.0.0.1:1024
    table sessions type ip size 100k

mailers alerts
    mailer smtp1 10.0.0.9:25

cache c1
    total-max-size 64
    max-age 300
    max-object-size 1048576

frontend fe
    bind :80
    rate-limit sessions 100
    capture request header Host len 32
    capture response header Server len 16
    capture cookie SESSION len 24
    compression algo gzip
    compression type text/html text/css
    compression offload
    filter compression
    stats enable
    stats uri /stats
    stats show-legends
    stats show-node
    stats show-desc
    stats scope be
    stats http-request deny unless { src 10.0.0.0/8 }
    guid fe-main
    default_backend be

backend be
    balance random(2)
    http-reuse safe
    stick on src
    stick match src
    stick store-request src
    use-fcgi-app php
    http-error status 503 content-type text/plain string "unavailable"
    tcp-check connect port 6379
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-response inspect-delay 5s
    server s1 10.0.0.1:80 check
