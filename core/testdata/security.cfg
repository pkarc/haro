# Casos de las reglas de seguridad y buenas prácticas.
# Cada sección está marcada con lo que debe (o no debe) detectar el detector.
global
    log /dev/log local0
    maxconn 2000
    ssl-default-bind-options ssl-min-ver TLSv1.0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

userlist team
    user ana insecure-password cambiame
    user luis insecure-password Zq8#vL2pX!
    user root password $5$salt$hash

# stats-exposed: público y sin protección
listen stats_open
    bind *:8404
    stats enable
    stats uri /stats

# stats con contraseña: correcto
listen stats_auth
    bind :8405
    stats enable
    stats uri /stats
    stats auth admin:Zq8#vL2pX!

# stats solo en local: correcto
listen stats_local
    bind 127.0.0.1:8406
    stats enable
    stats uri /stats

# internal-port-public: base de datos abierta sin ACL
listen pg_open
    mode tcp
    bind 0.0.0.0:5432
    server pg1 10.0.0.5:5432 check

# base de datos restringida por IP de origen: correcto
listen redis_ok
    mode tcp
    bind *:6379
    acl lan src 10.0.0.0/8
    tcp-request connection reject unless lan
    server r1 10.0.0.6:6379 check

# no-https-redirect + tls-legacy-protocol + no-forwardfor + no-health-check
frontend web
    bind :80
    bind :443 ssl crt /etc/haproxy/site.pem ssl-min-ver TLSv1.1
    default_backend app

backend app
    server a1 10.0.0.1:8080
    server a2 10.0.0.2:8080

# con redirección, forwardfor y checks: correcto
frontend web_ok
    bind :80
    bind :443 ssl crt /etc/haproxy/ok.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    option forwardfor
    default_backend app_ok

backend app_ok
    server a1 10.0.0.1:8080 check
    server a2 10.0.0.2:8080 check
