# Configuración de ejemplo de haro

global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 10s
    retries 3

frontend http_in
    bind *:80
    http-request redirect scheme https code 301

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/sitio.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    acl is_api path_beg /api
    acl is_static path_end .css .js .png .jpg .svg
    use_backend api_servers if is_api
    use_backend static_servers if is_static
    default_backend web_servers

backend web_servers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    cookie SERVERID insert indirect nocache
    server web1 10.0.0.11:8080 check cookie web1
    server web2 10.0.0.12:8080 check cookie web2

backend api_servers
    balance leastconn
    server api1 10.0.0.21:9000 check inter 2s fall 3 rise 2
    server api2 10.0.0.22:9000 check inter 2s fall 3 rise 2
    server api3 10.0.0.23:9000 check backup

backend static_servers
    server cdn1 10.0.0.31:80 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:cambiame
