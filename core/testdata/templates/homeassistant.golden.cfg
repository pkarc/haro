# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend homeassistant_http
    # Home Assistant: generado con la plantilla de haro
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend homeassistant_https
    bind *:443 ssl crt /etc/haproxy/certs/ha.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend homeassistant

backend homeassistant
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    # WebSocket permanente (/api/websocket)
    timeout tunnel 1h
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host ha.example.com
    http-check expect status 200
    server ha1 10.0.0.20:8123 check
