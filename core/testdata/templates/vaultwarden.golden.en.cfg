# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend vaultwarden_http
    # Vaultwarden: generated with the haro template
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend vaultwarden_https
    bind *:443 ssl crt /etc/haproxy/certs/vault.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend vaultwarden

backend vaultwarden
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    # Notifications over WebSocket
    timeout tunnel 1h
    option httpchk
    http-check send meth GET uri /alive ver HTTP/1.1 hdr Host vault.example.com
    http-check expect status 200
    server vw1 10.0.0.60:80 check
