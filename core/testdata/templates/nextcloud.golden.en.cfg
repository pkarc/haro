# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend nextcloud_http
    # Nextcloud: generated with the haro template
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend nextcloud_https
    bind *:443 ssl crt /etc/haproxy/certs/cloud.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend nextcloud

backend nextcloud
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    # CardDAV and CalDAV: automatic client discovery
    http-request redirect location /remote.php/dav/ code 301 if { path /.well-known/carddav /.well-known/caldav }
    http-response set-header Strict-Transport-Security "max-age=15552000; includeSubDomains"
    timeout server 10m
    option httpchk
    http-check send meth GET uri /status.php ver HTTP/1.1 hdr Host cloud.example.com
    http-check expect status 200
    server nc1 10.0.0.10:80 check
