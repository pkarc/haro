# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend redis_in
    # Redis: generado con la plantilla de haro
    bind 10.0.0.5:6379
    mode tcp
    option tcplog
    timeout client 30m
    default_backend redis

backend redis
    mode tcp
    balance first
    timeout server 30m
    option tcp-check
    tcp-check connect
    tcp-check send PING\r\n
    tcp-check expect string +PONG
    tcp-check send info\ replication\r\n
    tcp-check expect string role:master
    tcp-check send QUIT\r\n
    tcp-check expect string +OK
    server redis1 10.0.0.20:6379 check inter 1s
    server redis2 10.0.0.21:6379 check inter 1s
