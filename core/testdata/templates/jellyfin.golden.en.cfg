# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend jellyfin_http
    # Jellyfin: generated with the haro template
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend jellyfin_https
    bind *:443 ssl crt /etc/haproxy/certs/tv.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend jellyfin

backend jellyfin
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    # WebSocket (SyncPlay, remote control)
    timeout tunnel 1h
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host tv.example.com
    http-check expect status 200
    server jf1 10.0.0.30:8096 check
