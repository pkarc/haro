# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend grafana_http
    # Grafana: generated with the haro template
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend grafana_https
    bind *:443 ssl crt /etc/haproxy/certs/graf.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend grafana

backend grafana
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    # Grafana Live uses WebSocket
    timeout tunnel 1h
    option httpchk
    http-check send meth GET uri /api/health ver HTTP/1.1 hdr Host graf.example.com
    http-check expect status 200
    server grafana1 10.0.0.50:3000 check
