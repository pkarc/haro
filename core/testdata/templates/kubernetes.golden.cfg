# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend kubernetes_in
    # Kubernetes API: generado con la plantilla de haro
    bind *:6443
    mode tcp
    option tcplog
    timeout client 1h
    default_backend kubernetes

backend kubernetes
    mode tcp
    balance roundrobin
    timeout server 1h
    option ssl-hello-chk
    server cp1 10.0.0.81:6443 check inter 3s fall 3 rise 2
    server cp2 10.0.0.82:6443 check inter 3s fall 3 rise 2
    server cp3 10.0.0.83:6443 check inter 3s fall 3 rise 2
