# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend elasticsearch_http
    # Elasticsearch: generated with the haro template
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend elasticsearch_https
    bind *:443 ssl crt /etc/haproxy/certs/es.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend elasticsearch

backend elasticsearch
    mode http
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    option httpchk
    http-check send meth GET uri /_cluster/health ver HTTP/1.1 hdr Host es.example.com
    http-check expect rstatus ^(200|401)$
    server es1 10.0.0.71:9200 check check-ssl ssl verify required ca-file /etc/haproxy/certs/es-ca.pem
    server es2 10.0.0.72:9200 check check-ssl ssl verify required ca-file /etc/haproxy/certs/es-ca.pem
    server es3 10.0.0.73:9200 check check-ssl ssl verify required ca-file /etc/haproxy/certs/es-ca.pem
