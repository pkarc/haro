# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend proxmox_http
    # Proxmox VE: generado con la plantilla de haro
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend proxmox_https
    bind *:443 ssl crt /etc/haproxy/certs/pve.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend proxmox

backend proxmox
    mode http
    balance source
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    # noVNC y las consolas usan WebSocket: túnel largo
    timeout tunnel 1h
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host pve.example.com
    http-check expect status 200
    server pve1 10.0.0.11:8006 check check-ssl ssl verify required ca-file /etc/haproxy/certs/pve-root-ca.pem
    server pve2 10.0.0.12:8006 check check-ssl ssl verify required ca-file /etc/haproxy/certs/pve-root-ca.pem
