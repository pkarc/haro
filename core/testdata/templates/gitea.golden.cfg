# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend gitea_http
    # Gitea: generado con la plantilla de haro
    bind *:80
    mode http
    option httplog
    http-request redirect scheme https code 301 unless { ssl_fc }

frontend gitea_https
    bind *:443 ssl crt /etc/haproxy/certs/git.pem alpn h2,http/1.1
    mode http
    option httplog
    default_backend gitea

backend gitea
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host git.example.com
    http-check expect status 200
    server gitea1 10.0.0.40:3000 check

frontend gitea_ssh_in
    # git por SSH: TCP sin interpretar
    bind *:22
    mode tcp
    option tcplog
    timeout client 1h
    default_backend gitea_ssh

backend gitea_ssh
    mode tcp
    timeout server 1h
    server ssh1 10.0.0.40:2222 check
