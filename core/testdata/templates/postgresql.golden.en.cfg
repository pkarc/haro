# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check

frontend postgresql_in
    # PostgreSQL: generated with the haro template
    bind 10.0.0.5:5432
    mode tcp
    option tcplog
    timeout client 30m
    default_backend postgresql

backend postgresql
    mode tcp
    balance leastconn
    timeout server 30m
    option pgsql-check user haproxy
    server pg1 10.0.0.10:5432 check inter 3s fall 3 rise 2
    server pg2 10.0.0.11:5432 check inter 3s fall 3 rise 2 backup
