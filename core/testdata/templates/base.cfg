# Base mínima para las pruebas de plantillas por tecnología

global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend base_in
    bind 127.0.0.1:8080
    default_backend base

backend base
    server s1 127.0.0.1:9000 check
