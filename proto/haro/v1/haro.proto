// Contrato del núcleo de haro. Es la fuente de verdad de los tipos que
// comparten el servidor Go (`haro serve`) y la web en TypeScript.
//
// `haro serve` implementa estos servicios con Connect (rutas
// /haro.v1.CoreService/* y /haro.v1.ConfigService/*; admite Connect, gRPC y
// gRPC-Web, con mensajes protobuf o JSON). El código de Go (gen/) y de
// TypeScript (web/src/gen) se genera con `make proto`.
syntax = "proto3";

package haro.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/pkarc/haro/gen/haro/v1;harov1";

service CoreService {
  // Analiza una configuración: árbol, problemas, explicaciones, herencia y topología.
  rpc Analyze(AnalyzeRequest) returns (Analysis);
  // Compara dos configuraciones línea a línea.
  rpc Diff(DiffRequest) returns (DiffResponse);
  // Aplica operaciones de edición y devuelve los archivos resultantes, sin
  // escribir en disco. Es la única vía de edición de todas las interfaces.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Datos de la base de conocimiento que necesitan las interfaces (autocompletado, modo visual).
  rpc GetKnowledge(GetKnowledgeRequest) returns (Knowledge);
  // Valida con el binario real de HAProxy (`haproxy -c`), si está disponible.
  rpc Check(CheckRequest) returns (CheckResult);
  // Plantillas completas por tecnología (Nextcloud, PostgreSQL…): metadatos y parámetros.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  // Renderiza una plantilla por tecnología: devuelve las operaciones de edición
  // y el resultado de aplicarlas (como Apply), sin escribir en disco, para
  // poder mostrar el diff antes de aceptar.
  rpc RenderTemplate(RenderTemplateRequest) returns (RenderTemplateResponse);
}

// Asistente con IA. Solo existe si `haro serve` se inició con --assistant: la
// configuración se envía a la API de Anthropic desde el servidor local (la
// clave nunca llega al navegador). Sin --assistant devuelve UNIMPLEMENTED.
service AssistService {
  // Conversa sobre la configuración. La respuesta llega en streaming: trozos de
  // texto, y al final la propuesta de configuración extraída y el cierre.
  rpc Assist(AssistRequest) returns (stream AssistEvent);
}

service ConfigService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);
  rpc GetConfig(GetConfigRequest) returns (ConfigFile);
  // Guarda solo si --allow-write está activo y la validación pasa.
  rpc PutConfig(PutConfigRequest) returns (PutConfigResponse);
}

// Un único texto (text) o varios archivos (files) en orden de carga, como
// `haproxy -f a.cfg -f b.cfg`. Si llega files, text se ignora.
message AnalyzeRequest {
  string text = 1;
  repeated SourceFile files = 2;
  // Idioma de las explicaciones y de los mensajes del detector: "es" o "en".
  // Vacío = español. Cualquier otro valor es un error (INVALID_ARGUMENT).
  string lang = 3;
  // Versión de HAProxy objetivo ("2.8", "v3.0"…). Si se indica, el detector
  // avisa de lo que requiera una versión posterior (regla newer-than-target).
  // Vacío = sin versión objetivo. Un valor no válido es INVALID_ARGUMENT.
  string haproxy_version = 4;
}

message SourceFile {
  string path = 1;
  string text = 2;
}

message Analysis {
  Doc doc = 1;
  repeated Issue issues = 2;
  repeated LineExplanation explanations = 3;
  repeated Effective effective = 4;
  Topology topology = 5;
}

// Con varios archivos, Doc es la vista unificada en orden de carga y files
// lista las rutas; cada sección y línea indica su archivo.
message Doc {
  repeated Line pre = 1;
  repeated Section sections = 2;
  repeated string files = 3;
}

message Section {
  int32 file = 9;
  string type = 1;
  string name = 2;
  int32 line = 3;
  string indent = 4;
  string text = 5;
  repeated string tokens = 6;
  string comment = 7;
  repeated Line lines = 8;
}

message Line {
  int32 file = 8;
  string kind = 1; // blank | comment | directive
  int32 line = 2;
  string indent = 3;
  string text = 4;
  string keyword = 5;
  repeated string args = 6;
  string comment = 7;
}

message Issue {
  int32 file = 6;
  string rule = 1;
  string severity = 2; // error | warn | info
  int32 line = 3;
  int32 section = 4;
  string message = 5;
}

message Explanation {
  string text = 1; // markdown mínimo: **negrita** y `código`
  string category = 2;
  bool known = 3;
}

message LineExplanation {
  int32 file = 6;
  int32 line = 1;
  int32 section = 2;
  string keyword = 3;
  string args = 4;
  Explanation explanation = 5;
}

message Effective {
  string mode = 1;
  string mode_from = 2; // own | defaults | implicit
  map<string, bool> timeouts = 3;
  int32 defaults = 4;
}

message Topology {
  repeated EntryNode entries = 1;
  repeated BackendNode backends = 2;
  repeated Edge edges = 3;
  repeated string missing = 4;
}

message Bind {
  string address = 1;
  bool tls = 2;
}

message ServerNode {
  string name = 1;
  string address = 2;
  bool backup = 3;
  bool check = 4;
  bool disabled = 5;
  bool template = 6;
}

message EntryNode {
  int32 section = 1;
  string type = 2;
  string name = 3;
  repeated Bind binds = 4;
  repeated ServerNode servers = 5;
}

message BackendNode {
  int32 section = 1;
  string name = 2;
  string balance = 3;
  repeated ServerNode servers = 4;
}

message Edge {
  int32 file = 7;
  int32 from = 1;
  int32 to = 2;
  string to_name = 3;
  bool default = 4;
  string condition = 5;
  int32 line = 6;
}

// Operación de edición. Según op se usan unos campos u otros (ver core/edit.go):
// add_section, remove_section, move_section, rename_section, add_directive,
// update_directive, remove_directive, move_directive. Los índices de sección son
// los de la vista unificada; line_index es la posición en Section.lines.
message Op {
  string op = 1;
  int32 section = 2;
  string type = 3;
  string name = 4;
  bool template = 5;
  optional int32 file = 6;
  optional int32 at = 7;
  optional int32 to = 8;
  string text = 9;
  int32 line_index = 10;
  int32 delta = 11;
  bool update_refs = 12;
}

// Aplica ops en orden sobre los archivos (o sobre text). Si una falla no se
// aplica ninguna.
message ApplyRequest {
  string text = 1;
  repeated SourceFile files = 2;
  repeated Op ops = 3;
}

message FileChange {
  int32 file = 1;
  string path = 2;
  string text = 3;
}

message ApplyResponse {
  repeated SourceFile files = 1;    // todos los archivos, en orden de carga
  repeated FileChange changes = 2;  // solo los que cambiaron
}

message GetKnowledgeRequest {
  // Idioma de los textos: "es" o "en". Vacío = español.
  string lang = 1;
}

message SectionInfo {
  string color = 1;
  string named = 2; // required | optional | none
  string title = 3;
  string description = 4;
  string since = 5; // versión de HAProxy en que apareció ("2.3"); vacío si no se sabe
}

message DirectiveInfo {
  repeated string sections = 1;
  string category = 2;
  string description = 3;
  string since = 4; // versión de HAProxy en que apareció ("2.4"); vacío si no se sabe
}

message SectionTemplate {
  string name = 1;
  repeated string lines = 2; // {{backend}} se sustituye por el primer backend, o se omite la línea
}

message Knowledge {
  map<string, string> categories = 1;
  map<string, SectionInfo> sections = 2;
  map<string, DirectiveInfo> directives = 3;
  map<string, string> rules = 4; // id estable de la regla del detector -> descripción
  map<string, SectionTemplate> templates = 5;
}

message DiffRequest {
  string before = 1;
  string after = 2;
}

message DiffOp {
  string op = 1; // = | - | +
  string text = 2;
}

message DiffResponse { repeated DiffOp ops = 1; }

message CheckRequest {
  string text = 1;
  repeated SourceFile files = 2;
}

message CheckResult {
  bool available = 1;
  bool ok = 2;
  string output = 3;
}

message GetCapabilitiesRequest {}

message Capabilities {
  string version = 1;
  repeated string paths = 2; // argumentos de --file (archivos o directorios)
  bool can_read = 3;
  bool can_write = 4;
  bool can_check = 5;
  string haproxy_bin = 6;
  bool can_assist = 7;         // el asistente está activado (--assistant)
  string assistant_model = 8;  // modelo que usa el asistente
}

message GetConfigRequest {}

// Los archivos ya expandidos, en orden de carga.
message ConfigFile {
  repeated SourceFile files = 1;
}

// Guarda un archivo (path, text) o varios a la vez (files). Con varios, la
// configuración completa se valida con todos los cambios aplicados y se guarda
// todo o nada.
message PutConfigRequest {
  string path = 1;
  string text = 2;
  repeated SourceFile files = 3;
}

message SavedFile {
  string path = 1;
  string backup = 2;
}

message PutConfigResponse {
  bool saved = 1;
  string path = 2;   // si se guardó: el archivo (solo si fue uno); si no, el archivo del error del detector
  string backup = 3; // solo si se guardó un único archivo
  CheckResult check = 4; // salida de haproxy -c (también cuando lo rechaza)
  repeated SavedFile files = 5;
  // Un guardado rechazado por la validación no es un error de RPC: llega con
  // saved=false, el motivo en error y, según el validador, check o issue.
  string error = 6;
  Issue issue = 7; // error del detector de haro cuando no hay haproxy
}

message ListTemplatesRequest {
  // Idioma de los textos: "es" o "en". Vacío = español.
  string lang = 1;
}

// Parámetro de una plantilla por tecnología. Su valor viaja como
// google.protobuf.Value (ver RenderTemplateRequest.params).
message TemplateParam {
  string key = 1;
  string label = 2;
  string help = 3;
  string type = 4; // string | int | list | bool
  // Valor por defecto con el tipo del parámetro (texto, número, lista de textos
  // o bool); ausente si no hay.
  google.protobuf.Value default_value = 5;
  bool required = 6;
  string depends_on = 7; // solo se usa si ese parámetro bool es verdadero
  string example = 8;
}

message TechTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  string kind = 4; // web | tcp
  repeated TemplateParam params = 5;
}

message ListTemplatesResponse {
  repeated TechTemplate templates = 1;
}

// Un único texto (text) o varios archivos (files), como en Apply. Los
// parámetros son un mapa clave -> google.protobuf.Value: es la forma de llevar
// valores tipados (texto, número, bool y lista) sin inventar un mensaje con un
// oneof por tipo, y se corresponde 1:1 con el JSON que ya usan la CLI y el MCP.
// El núcleo también acepta texto para número, bool y lista (p. ej. "a:1,b:2").
// Un parámetro inválido o ausente es INVALID_ARGUMENT con el mensaje en lang.
message RenderTemplateRequest {
  string id = 1;
  map<string, google.protobuf.Value> params = 2;
  string text = 3;
  repeated SourceFile files = 4;
  string lang = 5;
}

message RenderTemplateResponse {
  repeated Op ops = 1;              // para aplicar con Apply
  repeated SourceFile files = 2;    // todos los archivos tras aplicarlas
  repeated FileChange changes = 3;  // solo los que cambiaron
}

message AssistMessage {
  string role = 1; // "user" | "assistant"
  string content = 2;
}

// La conversación (que debe terminar con un turno del usuario) y la
// configuración actual: el servidor añade la configuración y sus problemas al
// último turno, así el modelo siempre ve la versión vigente.
message AssistRequest {
  repeated SourceFile files = 1;
  repeated AssistMessage messages = 2;
  string lang = 3; // "es" | "en"; vacío = español
}

message AssistEvent {
  oneof event {
    string text = 1;       // trozo de la respuesta
    Proposal proposal = 2; // configuración propuesta, si la respuesta la trae
    AssistDone done = 3;   // último evento
  }
}

// Archivos que propone el asistente (texto completo, solo los que cambian) y
// los problemas que tendría la configuración resultante.
message Proposal {
  repeated FileChange changes = 1;
  repeated Issue issues_after = 2;
  int32 unmatched = 3;  // bloques de configuración que no se pudieron asociar a un archivo
  bool truncated = 4;   // la respuesta se cortó dentro de un bloque: ese bloque se descartó
}

message AssistDone {
  string stop_reason = 1;       // end_turn | max_tokens | refusal …
  string refusal_category = 2;  // si stop_reason == refusal
  int32 input_tokens = 3;
  int32 output_tokens = 4;
}
