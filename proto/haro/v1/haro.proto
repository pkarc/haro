// haro core contract. It is the source of truth for the types shared by the Go
// server (`haro serve`) and the TypeScript web UI.
//
// `haro serve` implements these services with Connect (routes
// /haro.v1.CoreService/* and /haro.v1.ConfigService/*; it supports Connect,
// gRPC and gRPC-Web, with protobuf or JSON messages). The Go (gen/) and
// TypeScript (web/src/gen) code is generated with `make proto`.
syntax = "proto3";

package haro.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/pkarc/haro/gen/haro/v1;harov1";

service CoreService {
  // Analyzes a configuration: tree, problems, explanations, inheritance and topology.
  rpc Analyze(AnalyzeRequest) returns (Analysis);
  // Compares two configurations line by line.
  rpc Diff(DiffRequest) returns (DiffResponse);
  // Applies edit operations and returns the resulting files, without writing
  // to disk. It is the only editing path for all interfaces.
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  // Knowledge base data the interfaces need (autocompletion, visual mode).
  rpc GetKnowledge(GetKnowledgeRequest) returns (Knowledge);
  // Validates with the real HAProxy binary (`haproxy -c`), if available.
  rpc Check(CheckRequest) returns (CheckResult);
  // Full templates by technology (Nextcloud, PostgreSQL…): metadata and parameters.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  // Renders a technology template: returns the edit operations and the result
  // of applying them (like Apply), without writing to disk, so the diff can be
  // shown before accepting.
  rpc RenderTemplate(RenderTemplateRequest) returns (RenderTemplateResponse);
}

// AI assistant. It only exists if `haro serve` was started with --assistant:
// the configuration is sent to the Anthropic API from the local server (the
// key never reaches the browser). Without --assistant it returns UNIMPLEMENTED.
service AssistService {
  // Chats about the configuration. The response is streamed: chunks of text,
  // and at the end the extracted configuration proposal and the closing event.
  rpc Assist(AssistRequest) returns (stream AssistEvent);
}

service ConfigService {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);
  rpc GetConfig(GetConfigRequest) returns (ConfigFile);
  // Saves only if --allow-write is active and validation passes.
  rpc PutConfig(PutConfigRequest) returns (PutConfigResponse);
}

// A single text (text) or several files (files) in load order, like
// `haproxy -f a.cfg -f b.cfg`. If files is present, text is ignored.
message AnalyzeRequest {
  string text = 1;
  repeated SourceFile files = 2;
  // Language of the explanations and detector messages: "es" | "en";
  // empty = English. Any other value is an error (INVALID_ARGUMENT).
  string lang = 3;
  // Target HAProxy version ("2.8", "v3.0"…). If given, the detector warns
  // about anything that needs a later version (newer-than-target rule).
  // Empty = no target version. An invalid value is INVALID_ARGUMENT.
  string haproxy_version = 4;
}

message SourceFile {
  string path = 1;
  string text = 2;
}

message Analysis {
  Doc doc = 1;
  repeated Issue issues = 2;
  repeated LineExplanation explanations = 3;
  repeated Effective effective = 4;
  Topology topology = 5;
}

// With several files, Doc is the unified view in load order and files lists
// the paths; each section and line states its file.
message Doc {
  repeated Line pre = 1;
  repeated Section sections = 2;
  repeated string files = 3;
}

message Section {
  int32 file = 9;
  string type = 1;
  string name = 2;
  int32 line = 3;
  string indent = 4;
  string text = 5;
  repeated string tokens = 6;
  string comment = 7;
  repeated Line lines = 8;
}

message Line {
  int32 file = 8;
  string kind = 1; // blank | comment | directive
  int32 line = 2;
  string indent = 3;
  string text = 4;
  string keyword = 5;
  repeated string args = 6;
  string comment = 7;
}

message Issue {
  int32 file = 6;
  string rule = 1;
  string severity = 2; // error | warn | info
  int32 line = 3;
  int32 section = 4;
  string message = 5;
}

message Explanation {
  string text = 1; // minimal markdown: **bold** and `code`
  string category = 2;
  bool known = 3;
}

message LineExplanation {
  int32 file = 6;
  int32 line = 1;
  int32 section = 2;
  string keyword = 3;
  string args = 4;
  Explanation explanation = 5;
}

message Effective {
  string mode = 1;
  string mode_from = 2; // own | defaults | implicit
  map<string, bool> timeouts = 3;
  int32 defaults = 4;
}

message Topology {
  repeated EntryNode entries = 1;
  repeated BackendNode backends = 2;
  repeated Edge edges = 3;
  repeated string missing = 4;
}

message Bind {
  string address = 1;
  bool tls = 2;
}

message ServerNode {
  string name = 1;
  string address = 2;
  bool backup = 3;
  bool check = 4;
  bool disabled = 5;
  bool template = 6;
}

message EntryNode {
  int32 section = 1;
  string type = 2;
  string name = 3;
  repeated Bind binds = 4;
  repeated ServerNode servers = 5;
}

message BackendNode {
  int32 section = 1;
  string name = 2;
  string balance = 3;
  repeated ServerNode servers = 4;
}

message Edge {
  int32 file = 7;
  int32 from = 1;
  int32 to = 2;
  string to_name = 3;
  bool default = 4;
  string condition = 5;
  int32 line = 6;
}

// Edit operation. Depending on op, some fields or others are used (see core/edit.go):
// add_section, remove_section, move_section, rename_section, add_directive,
// update_directive, remove_directive, move_directive. Section indexes are those
// of the unified view; line_index is the position in Section.lines.
message Op {
  string op = 1;
  int32 section = 2;
  string type = 3;
  string name = 4;
  bool template = 5;
  optional int32 file = 6;
  optional int32 at = 7;
  optional int32 to = 8;
  string text = 9;
  int32 line_index = 10;
  int32 delta = 11;
  bool update_refs = 12;
}

// Applies ops in order to the files (or to text). If one fails, none is applied.
message ApplyRequest {
  string text = 1;
  repeated SourceFile files = 2;
  repeated Op ops = 3;
  // Language of the error messages: "es" | "en"; empty = English.
  string lang = 4;
}

message FileChange {
  int32 file = 1;
  string path = 2;
  string text = 3;
}

message ApplyResponse {
  repeated SourceFile files = 1;    // all files, in load order
  repeated FileChange changes = 2;  // only those that changed
}

message GetKnowledgeRequest {
  // Language of the texts: "es" | "en"; empty = English.
  string lang = 1;
}

message SectionInfo {
  string color = 1;
  string named = 2; // required | optional | none
  string title = 3;
  string description = 4;
  string since = 5; // HAProxy version in which it appeared ("2.3"); empty if unknown
}

message DirectiveInfo {
  repeated string sections = 1;
  string category = 2;
  string description = 3;
  string since = 4; // HAProxy version in which it appeared ("2.4"); empty if unknown
}

message SectionTemplate {
  string name = 1;
  repeated string lines = 2; // {{backend}} is replaced by the first backend, or the line is omitted
}

message Knowledge {
  map<string, string> categories = 1;
  map<string, SectionInfo> sections = 2;
  map<string, DirectiveInfo> directives = 3;
  map<string, string> rules = 4; // stable detector rule id -> description
  map<string, SectionTemplate> templates = 5;
}

message DiffRequest {
  string before = 1;
  string after = 2;
}

message DiffOp {
  string op = 1; // = | - | +
  string text = 2;
}

message DiffResponse { repeated DiffOp ops = 1; }

message CheckRequest {
  string text = 1;
  repeated SourceFile files = 2;
}

message CheckResult {
  bool available = 1;
  bool ok = 2;
  string output = 3;
}

message GetCapabilitiesRequest {}

message Capabilities {
  string version = 1;
  repeated string paths = 2; // --file arguments (files or directories)
  bool can_read = 3;
  bool can_write = 4;
  bool can_check = 5;
  string haproxy_bin = 6;
  bool can_assist = 7;         // the assistant is enabled (--assistant)
  string assistant_model = 8;  // model used by the assistant
}

message GetConfigRequest {}

// The already expanded files, in load order.
message ConfigFile {
  repeated SourceFile files = 1;
}

// Saves one file (path, text) or several at once (files). With several, the
// full configuration is validated with all changes applied and saved all or
// nothing.
message PutConfigRequest {
  string path = 1;
  string text = 2;
  repeated SourceFile files = 3;
}

message SavedFile {
  string path = 1;
  string backup = 2;
}

message PutConfigResponse {
  bool saved = 1;
  string path = 2;   // if saved: the file (only if it was one); otherwise, the file of the detector error
  string backup = 3; // only if a single file was saved
  CheckResult check = 4; // output of haproxy -c (also when it rejects)
  repeated SavedFile files = 5;
  // A save rejected by validation is not an RPC error: it arrives with
  // saved=false, the reason in error and, depending on the validator, check or issue.
  string error = 6;
  Issue issue = 7; // haro detector error when there is no haproxy
}

message ListTemplatesRequest {
  // Language of the texts: "es" | "en"; empty = English.
  string lang = 1;
}

// Parameter of a technology template. Its value travels as
// google.protobuf.Value (see RenderTemplateRequest.params).
message TemplateParam {
  string key = 1;
  string label = 2;
  string help = 3;
  string type = 4; // string | int | list | bool
  // Default value with the parameter's type (text, number, list of texts or
  // bool); absent if there is none.
  google.protobuf.Value default_value = 5;
  bool required = 6;
  string depends_on = 7; // only used if that bool parameter is true
  string example = 8;
}

message TechTemplate {
  string id = 1;
  string name = 2;
  string description = 3;
  string kind = 4; // web | tcp
  repeated TemplateParam params = 5;
}

message ListTemplatesResponse {
  repeated TechTemplate templates = 1;
}

// A single text (text) or several files (files), as in Apply. The parameters
// are a key -> google.protobuf.Value map: it is the way to carry typed values
// (text, number, bool and list) without inventing a message with a oneof per
// type, and it maps 1:1 to the JSON the CLI and MCP already use.
// The core also accepts text for number, bool and list (e.g. "a:1,b:2").
// An invalid or missing parameter is INVALID_ARGUMENT with the message in lang.
message RenderTemplateRequest {
  string id = 1;
  map<string, google.protobuf.Value> params = 2;
  string text = 3;
  repeated SourceFile files = 4;
  string lang = 5;
}

message RenderTemplateResponse {
  repeated Op ops = 1;              // to apply with Apply
  repeated SourceFile files = 2;    // all files after applying them
  repeated FileChange changes = 3;  // only those that changed
}

message AssistMessage {
  string role = 1; // "user" | "assistant"
  string content = 2;
}

// The conversation (which must end with a user turn) and the current
// configuration: the server adds the configuration and its problems to the last
// turn, so the model always sees the current version.
message AssistRequest {
  repeated SourceFile files = 1;
  repeated AssistMessage messages = 2;
  string lang = 3; // "es" | "en"; empty = English
}

message AssistEvent {
  oneof event {
    string text = 1;       // chunk of the response
    Proposal proposal = 2; // proposed configuration, if the response has one
    AssistDone done = 3;   // last event
  }
}

// Files proposed by the assistant (full text, only those that change) and the
// problems the resulting configuration would have.
message Proposal {
  repeated FileChange changes = 1;
  repeated Issue issues_after = 2;
  int32 unmatched = 3;  // configuration blocks that could not be matched to a file
  bool truncated = 4;   // the response was cut inside a block: that block was discarded
}

message AssistDone {
  string stop_reason = 1;       // end_turn | max_tokens | refusal …
  string refusal_category = 2;  // si stop_reason == refusal
  int32 input_tokens = 3;
  int32 output_tokens = 4;
}
