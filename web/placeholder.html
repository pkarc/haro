<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>haro</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#0c0f14;color:#d9e0ea;max-width:760px;margin:40px auto;padding:0 16px}code,textarea,pre{font-family:ui-monospace,monospace}textarea{width:100%;height:220px;background:#12161d;color:inherit;border:1px solid #2f3948;border-radius:8px;padding:10px}button{background:#5eead4;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}pre{background:#12161d;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head>
<body><h1>haro</h1><p>This is the placeholder page: the React interface has not been built yet. Run <code>make web</code> and rebuild the binary.</p>
<p>Meanwhile you can try the local API:</p>
<textarea id="t">frontend web
    bind *:80
    default_backend app

backend app
    server a1 10.0.0.1:8080 check</textarea>
<p><button id="b">Analyze</button></p><pre id="o"></pre>
<script>
document.getElementById('b').onclick=async()=>{const r=await fetch('/haro.v1.CoreService/Analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({files:[{path:'haproxy.cfg',text:document.getElementById('t').value}]})});const a=await r.json();
document.getElementById('o').textContent=a.explanations.map(e=>'L'+e.line+' '+e.keyword+' — '+e.explanation.text.replace(/\*\*|`/g,'')).join('\n')+'\n\n'+(a.issues.length?a.issues.map(i=>'['+i.severity+'] L'+i.line+' '+i.message).join('\n'):'No problems detected');};
</script></body></html>
