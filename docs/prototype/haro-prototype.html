<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HAProxy Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0f14;--panel:#12161d;--panel2:#171c25;--panel3:#1d2330;--line:#242c39;--line2:#2f3948;
  --text:#d9e0ea;--muted:#8592a5;--dim:#5d6a7d;--accent:#5eead4;--accent2:#2dd4bf;
  --err:#f87171;--warn:#fbbf24;--info:#60a5fa;--ok:#4ade80;--add:#4ade80;--del:#f87171;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
code{font-family:var(--mono);font-size:.92em}
input,select,textarea{font:inherit;color:var(--text)}
[hidden]{display:none!important}
.muted{color:var(--muted)}.sm{font-size:12px}.pad{padding:12px}
.warn{color:var(--warn)}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#10141b,#0d1117)}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;letter-spacing:.2px;white-space:nowrap}
.brand b{color:var(--accent);font-weight:600}
.top-actions{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.icon{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--muted);font-size:15px;transition:background .15s,color .15s}
.icon:hover:not(:disabled){background:var(--panel3);color:var(--text)}
.icon.danger:hover{color:var(--err)}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13px}
.tbtn:hover{background:var(--panel3);color:var(--text)}
.tbtn.on{color:var(--accent);background:rgba(94,234,212,.08)}
.tbtn .ic{font-size:14px}

/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
#app.chat-open .layout{grid-template-columns:minmax(0,1fr) 420px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-pane{display:none;border-left:1px solid var(--line);background:var(--panel)}
#app.chat-open .chat-pane{display:flex}
.pane-head{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:46px;background:var(--panel)}
.pane-body{flex:1;min-height:0;position:relative}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:5px 14px;border-radius:7px;color:var(--muted);font-size:13px;font-weight:500}
.seg button.on{background:var(--panel3);color:var(--text);box-shadow:0 0 0 1px var(--line2)}
.probs-btn{margin-left:auto;display:flex;gap:8px;font-size:12px;padding:5px 10px;border-radius:8px}
.probs-btn:hover{background:var(--panel3)}
.ok-t{color:var(--ok)}
.cnt{font-weight:600}.cnt.sev-error{color:var(--err)}.cnt.sev-warn{color:var(--warn)}.cnt.sev-info{color:var(--info)}
.probs{max-height:38vh;overflow:auto;border-bottom:1px solid var(--line);background:var(--panel2)}
.probs.hidden{display:none}
.probs-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line)}
.prob{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:10px;align-items:baseline;padding:6px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.prob .sv{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.prob.sev-error .sv{color:var(--err)}.prob.sev-warn .sv{color:var(--warn)}.prob.sev-info .sv{color:var(--info)}
.prob .pl{font-family:var(--mono);color:var(--dim);font-size:12px}
.link{color:var(--accent);font-size:12px;padding:2px 4px;border-radius:5px}
.link:hover{background:rgba(94,234,212,.1)}

/* buttons */
.btn{height:32px;padding:0 12px;border-radius:8px;background:var(--panel3);border:1px solid var(--line2);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3d4a5c}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.primary{background:var(--accent);color:#06221e;border-color:transparent}
.btn.primary:hover{background:#7ff0de}
.btn.danger{color:var(--err);border-color:rgba(248,113,113,.35)}
.btn.primary.danger{background:var(--err);color:#2a0b0b}

/* code editor */
.code-view{position:absolute;inset:0;display:flex;flex-direction:column}
.editor{flex:1;min-height:0;display:flex;background:var(--bg);font:13px/20px var(--mono)}
.gutter{width:52px;flex:none;overflow:hidden;border-right:1px solid var(--line);background:var(--panel);padding-top:12px;user-select:none}
.ln{height:20px;text-align:right;padding-right:10px;color:var(--dim);font-size:12px;position:relative}
.ln.m-error,.ln.m-warn,.ln.m-info{color:var(--text)}
.ln.m-error::before,.ln.m-warn::before,.ln.m-info::before{content:'';position:absolute;left:7px;top:7px;width:6px;height:6px;border-radius:50%}
.ln.m-error::before{background:var(--err)}.ln.m-warn::before{background:var(--warn)}.ln.m-info::before{background:var(--info)}
.code-wrap{flex:1;min-width:0;position:relative}
.hl,#codeTa{position:absolute;inset:0;margin:0;padding:12px 16px 40px;font:inherit;white-space:pre;tab-size:4;border:0;letter-spacing:0}
.hl{overflow:hidden;pointer-events:none;color:var(--text)}
.hl code{font:inherit}
#codeTa{background:transparent;color:transparent;caret-color:var(--accent);resize:none;outline:none;overflow:auto;-webkit-text-fill-color:transparent}
#codeTa::selection{background:rgba(94,234,212,.22);-webkit-text-fill-color:transparent}
.t-cm{color:#64748b;font-style:italic}
.t-sec{color:var(--c);font-weight:600}
.t-name{color:#f8fafc;font-weight:600}
.t-kw{color:#7dd3fc}
.t-kw2{color:#c4b5fd}
.t-cond{color:#f472b6;font-weight:500}
.t-op{color:#f472b6}
.t-str{color:#86efac}
.t-var{color:#fcd34d}
.t-flag{color:#fda4af}
.t-num{color:#fdba74}
.t-addr{color:#5eead4}
.t-path{color:#a5b4fc}
.t-arg{color:#cbd5e1}
.status{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);font-size:12.5px;min-height:40px;max-height:30%;overflow:auto}
.st-ln{font-family:var(--mono);color:var(--dim)}
.st-x{color:var(--text)}
.st-iss{font-size:12px;padding:1px 6px;border-radius:5px}
.st-iss.sev-error{color:var(--err);background:rgba(248,113,113,.1)}.st-iss.sev-warn{color:var(--warn);background:rgba(251,191,36,.1)}.st-iss.sev-info{color:var(--info);background:rgba(96,165,250,.1)}
.status code.kw{color:#7dd3fc}

/* shared bits */
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:600 11.5px var(--mono);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent);text-transform:lowercase}
.badge.sm{height:20px;font-size:11px}
.acl{font-family:var(--mono);font-size:.9em;color:#f9a8d4;background:rgba(244,114,182,.1);padding:0 4px;border-radius:4px}
.cond{color:#f472b6}
.phase{color:var(--muted);font-size:.92em}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--ok)}.dot.off{background:var(--dim)}.dot.wait{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* visual */
.visual-view{position:absolute;inset:0;overflow:auto;padding:14px 16px 80px;scroll-behavior:auto}
.v-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:12px;font-size:12px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c,#5eead4) 35%,var(--line));color:var(--c,var(--text));font:500 12px var(--mono);background:color-mix(in srgb,var(--c,#5eead4) 7%,transparent)}
.chip:hover{background:color-mix(in srgb,var(--c,#5eead4) 16%,transparent)}
.map{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px}
.map summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none;font-weight:600}
.map summary::-webkit-details-marker{display:none}
.map summary::before{content:'▸';color:var(--muted);transition:transform .15s}
.map[open] summary::before{transform:rotate(90deg)}
.map-scroll{overflow-x:auto;padding:0 14px 12px}
.map-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(170px,1fr));gap:28px 64px;min-width:640px}
.map-svg{position:absolute;inset:0;pointer-events:none;overflow:visible}
.map-svg path{fill:none;stroke-width:1.6;pointer-events:stroke}
.e-def{stroke:#38bdf8}.e-cond{stroke:#f472b6;stroke-dasharray:5 4}.e-srv{stroke:#475569}.e-srv.backup{stroke-dasharray:2 4}.e-missing{stroke:var(--err);stroke-dasharray:3 3}
.map-col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.map-col h4{margin:0 0 2px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);font-weight:600}
.node{border:1px solid var(--line2);background:var(--panel2);border-radius:9px;padding:7px 10px;cursor:pointer;transition:border-color .15s}
.node:hover{border-color:#4b5a70}
.node-t{font:600 13px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-s{font:12px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node-c{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.node-c span{font-size:11px;padding:0 6px;border-radius:5px;font-family:var(--mono)}
.node-c .def{color:#7dd3fc;background:rgba(56,189,248,.1)}.node-c .cnd{color:#f9a8d4;background:rgba(244,114,182,.1)}
.node.fe{border-left:3px solid var(--c)}
.node.be{border-left:3px solid #fbbf24}
.node.srv{padding:5px 9px}.node.srv .node-t{font-size:12.5px}
.node.srv.backup{border-style:dashed}.node.srv.disabled{opacity:.5}
.node.missing{border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.06);cursor:default}.node.missing .node-s{color:var(--err)}
.mini{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted)}
.lg{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.lg.solid{border-color:#38bdf8}.lg.dash{border-color:#f472b6;border-top-style:dashed}.lg.srvl{border-color:#475569}
.pre-notes{margin-bottom:12px}
.sec{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:12px;overflow:hidden;border-top:2px solid var(--c);transition:box-shadow .3s}
.sec.has-error{border-color:rgba(248,113,113,.45);border-top-color:var(--c)}
.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;background:color-mix(in srgb,var(--c) 5%,var(--panel))}
.tog{transition:transform .15s}
.sec.collapsed .tog{transform:rotate(-90deg)}
.sec.collapsed .sec-b{display:none}
.sec-name{font:600 14px var(--mono);color:#f8fafc;padding:2px 6px;border-radius:6px;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-name:hover{background:var(--panel3)}
.sec-title{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-count{font:11px var(--mono);color:var(--dim);background:var(--bg);border-radius:10px;padding:0 7px}
.sec-act{margin-left:auto;display:flex;gap:0;flex:none}
.sec-act .icon{width:28px;height:28px;font-size:13px}
.sec-b{padding:2px 12px 12px}
.sec-desc{margin:6px 0 8px;color:var(--muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.pill{font:11.5px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 8px}
.dirs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--panel2);transition:background .3s}
.row:last-child{border-bottom:0}
.dir-main{flex:1;min-width:0;padding:8px 10px;cursor:text}
.dir-main:hover{background:var(--panel3)}
.dir-code{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-family:var(--mono);font-size:13px}
.dir-code .kw{color:#7dd3fc;font-weight:600}
.dir-code .args{color:#cbd5e1;word-break:break-all}
.dir-exp{font-size:13px;color:#b8c2d0;margin-top:3px;line-height:1.5}
.dir-exp b{color:#eef2f7;font-weight:600}
.dir-exp code{color:#5eead4;background:rgba(94,234,212,.07);padding:0 3px;border-radius:3px}
.dir-cmt{font:12px var(--mono);color:#64748b;font-style:italic;margin-top:2px}
.row.unknown .dir-exp{color:var(--muted);font-style:italic}
.row.sev-error{box-shadow:inset 3px 0 var(--err)}.row.sev-warn{box-shadow:inset 3px 0 var(--warn)}.row.sev-info{box-shadow:inset 3px 0 var(--info)}
.dir-act{display:flex;align-items:center;padding:0 4px;opacity:.35;transition:opacity .15s}
.row:hover .dir-act,.row:focus-within .dir-act{opacity:1}
.dir-act .icon{width:26px;height:26px;font-size:12px}
.cat{font:600 9.5px var(--sans);letter-spacing:.5px;text-transform:uppercase;padding:1px 6px;border-radius:4px;color:var(--cc);background:color-mix(in srgb,var(--cc) 13%,transparent);align-self:center}
.cat-net{--cc:#38bdf8}.cat-route{--cc:#f472b6}.cat-srv{--cc:#fbbf24}.cat-health{--cc:#4ade80}.cat-time{--cc:#fdba74}.cat-log{--cc:#94a3b8}.cat-sec{--cc:#f87171}.cat-tls{--cc:#a78bfa}.cat-perf{--cc:#2dd4bf}.cat-proc{--cc:#94a3b8}.cat-http{--cc:#60a5fa}.cat-persist{--cc:#e879f9}.cat-stats{--cc:#a3e635}.cat-misc{--cc:#94a3b8}
.cmt{font:12.5px var(--mono);color:#64748b;font-style:italic}
.cmt.row{padding:0}.cmt-t{flex:1;padding:6px 10px;cursor:text}
.pre-notes .cmt{padding:2px 0}
.iss{font-size:12.5px;margin-top:6px;padding:5px 8px;border-radius:6px}
.iss span{font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
.iss.sev-error{background:rgba(248,113,113,.09);color:#fca5a5}.iss.sev-warn{background:rgba(251,191,36,.08);color:#fcd34d}.iss.sev-info{background:rgba(96,165,250,.08);color:#93c5fd}
form.dir.editing{display:block;padding:8px 10px;background:var(--panel3);border-bottom:1px solid var(--line)}
form.dir.editing input,.add-dir input{width:100%;height:34px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);font:13px var(--mono);outline:none}
form.dir.editing input:focus,.add-dir input:focus{border-color:var(--accent)}
.ed-act{display:flex;gap:6px;margin:6px 0 4px}
.add-dir{display:flex;gap:6px;margin-top:8px}
.add-dir input{flex:1;min-width:0;background:transparent;border-style:dashed}
.flash{animation:flash 1.3s}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.empty{text-align:center;padding:48px 16px}

/* chat */
.chat-title{font-weight:600;color:var(--accent);white-space:nowrap}
.ai-status{font-size:12px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-log{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
.chat-empty{margin:auto 0;text-align:center;padding:10px}
.chat-empty .spark{font-size:28px;color:var(--accent)}
.chat-empty h3{margin:6px 0 4px;font-size:16px}
.chat-empty p{font-size:13px;margin:0 0 14px}
.starters{display:flex;flex-direction:column;gap:6px}
.starters .chip{height:auto;padding:8px 12px;border-radius:9px;text-align:left;font:13px/1.4 var(--sans);color:var(--text);--c:#5eead4}
.msg{display:flex}
.msg.user{justify-content:flex-end}
.bubble{max-width:100%;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--panel3);border:1px solid var(--line2);padding:8px 12px;border-radius:12px 12px 3px 12px;max-width:88%}
.msg.ai .bubble{width:100%}
.msg.err .bubble{color:#fca5a5}
.md p{margin:0 0 8px}.md ul,.md ol{margin:0 0 8px;padding-left:20px}.md li{margin:2px 0}.md h4{margin:10px 0 6px;font-size:13.5px}
.md code{background:var(--panel3);padding:1px 4px;border-radius:4px;color:#e2e8f0}
.cb{border:1px solid var(--line2);border-radius:9px;margin:8px 0;overflow:hidden;background:var(--bg)}
.cb-h{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 10px;font:11.5px var(--mono);color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.cb-pre{margin:0;padding:10px 12px;overflow:auto;font:12px/18px var(--mono);white-space:pre}
.cb-pre code{background:none;padding:0;color:var(--text)}
.cb-pre.long{max-height:290px}
.expand{display:block;width:100%;text-align:center;padding:5px;border-top:1px solid var(--line);border-radius:0}
.cfg-prop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);background:rgba(94,234,212,.05)}
.cfg-prop.same{background:transparent;color:var(--muted)}
.cfg-prop-t{font-size:12.5px;font-weight:600}
.cfg-prop-b{display:flex;gap:6px}
.add{color:var(--add)}.del{color:var(--del)}
.typing{display:inline-flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.chat-input{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line);background:var(--panel)}
.chat-input textarea{flex:1;resize:none;min-height:40px;max-height:160px;padding:9px 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);outline:none;line-height:1.45}
.chat-input textarea:focus{border-color:var(--accent)}
.chat-input .btn{height:40px}

/* modals / toasts */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.7);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(2px)}
.modal{width:min(480px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{width:min(900px,100%)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.modal h3{margin:0;font-size:15px}
.modal-b{padding:6px 14px 12px;overflow:auto}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;margin:10px 0}
.fld span{font-size:12px;color:var(--muted);font-weight:500}
.fld input,.fld select{height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);outline:none}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
textarea.mono{width:100%;font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px;outline:none;resize:vertical}
textarea.big{min-height:46vh}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.diff-sum{font-size:13px;margin-bottom:8px}.sev-error-t{color:var(--err)}
.diff{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:60vh;background:var(--bg);font:12px/19px var(--mono)}
.dl{display:grid;grid-template-columns:36px 36px 16px 1fr;white-space:pre;min-width:max-content}
.dl .n{color:var(--dim);text-align:right;padding-right:6px;user-select:none}
.dl .s{text-align:center;user-select:none}
.dl.da{background:rgba(74,222,128,.09)}.dl.da .s{color:var(--add)}
.dl.dd{background:rgba(248,113,113,.09)}.dl.dd .s{color:var(--del)}.dl.dd .c{opacity:.75}
.dl.skip{display:block;color:var(--dim);padding:2px 12px;background:var(--panel2);font-style:italic}
.hist-save{display:flex;gap:8px;margin-bottom:12px}
.hist-save input{flex:1;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg);outline:none}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.hist-b{display:flex;gap:6px;align-items:center;flex:none}
#toastRoot{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;width:max-content;max-width:calc(100vw - 24px)}
.toast{display:flex;align-items:center;gap:12px;background:#1f2633;border:1px solid var(--line2);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .4s,transform .4s}
.toast.out{opacity:0;transform:translateY(8px)}

/* mobile */
.mobile-tabs{display:none}
@media (max-width:899px){
  .desk-only{display:none!important}
  #app.chat-open .layout{grid-template-columns:1fr}

<script>
'use strict';
/* ===================== HAProxy Studio — núcleo (parser, explicaciones, lint) ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const C = s => `<code>${esc(s)}</code>`;
const B = s => `<b>${esc(s)}</b>`;

const SECTIONS = {
  global:   { color: '#a78bfa', named: false, title: 'Configuración global', desc: 'Ajustes de todo el proceso HAProxy: usuario y grupo, logs, límite de conexiones, socket de administración y TLS por defecto.' },
  defaults: { color: '#94a3b8', named: 'opt', title: 'Valores por defecto', desc: 'Todo lo que pongas aquí lo heredan los frontend, backend y listen que aparecen después (hasta el siguiente defaults).' },
  frontend: { color: '#38bdf8', named: true, title: 'Entrada de tráfico', desc: 'Dónde escucha HAProxy (bind) y qué reglas deciden a qué backend va cada petición.' },
  backend:  { color: '#fbbf24', named: true, title: 'Grupo de servidores', desc: 'Los servidores destino, cómo se reparte la carga entre ellos y cómo se comprueba su salud.' },
  listen:   { color: '#4ade80', named: true, title: 'Entrada + servidores', desc: 'Frontend y backend en una sola sección. Típico para servicios TCP o la página de estadísticas.' },
  resolvers:{ color: '#f472b6', named: true, title: 'Resolución DNS', desc: 'Servidores DNS que HAProxy consulta para resolver en caliente los nombres de los servidores.' },
  peers:    { color: '#fb923c', named: true, title: 'Réplicas (peers)', desc: 'Otras instancias de HAProxy con las que sincronizar stick-tables (persistencia, rate limits).' },
  userlist: { color: '#e879f9', named: true, title: 'Usuarios', desc: 'Usuarios y grupos para autenticación HTTP básica.' },
  mailers:  { color: '#f472b6', named: true, title: 'Alertas por email', desc: 'Servidores SMTP para avisar de cambios de estado de los servidores.' },
  cache:    { color: '#2dd4bf', named: true, title: 'Caché HTTP', desc: 'Caché en memoria para respuestas HTTP pequeñas y frecuentes.' },
  'http-errors': { color: '#f87171', named: true, title: 'Páginas de error', desc: 'Conjunto reutilizable de páginas de error personalizadas.' },
  ring:     { color: '#94a3b8', named: true, title: 'Buffer de logs', desc: 'Buffer circular en memoria para logs o trazas.' },
  program:  { color: '#94a3b8', named: true, title: 'Programa externo', desc: 'Proceso externo que el maestro de HAProxy arranca y supervisa.' },
};
const PROXY_SECS = new Set(['global', 'defaults', 'frontend', 'backend', 'listen']);
const SEC_CODE = { global: 'G', defaults: 'D', frontend: 'F', backend: 'B', listen: 'L', resolvers: 'R', peers: 'P', userlist: 'U', mailers: 'M', cache: 'C', 'http-errors': 'E', ring: 'N', program: 'X' };

const CATS = { net: 'Red', route: 'Enrutado', srv: 'Servidores', health: 'Salud', time: 'Timeout', log: 'Logs', sec: 'Seguridad', tls: 'TLS', perf: 'Rendimiento', proc: 'Proceso', http: 'HTTP', persist: 'Persistencia', stats: 'Stats', misc: 'Otros' };

/* ---------- Tokenizer / parser / serializer ---------- */
function tokenize(str) {
  const tokens = []; let i = 0, cur = '', has = false, q = null;
  while (i < str.length) {
    const ch = str[i];
    if (q) {
      if (ch === '\\' && q === '"' && i + 1 < str.length) { cur += str[i + 1]; i += 2; continue; }
      if (ch === q) { q = null; i++; continue; }
      cur += ch; i++; continue;
    }
    if (ch === '"' || ch === "'") { q = ch; has = true; i++; continue; }
    if (ch === '\\' && i + 1 < str.length) { cur += str[i + 1]; has = true; i += 2; continue; }
    if (ch === '#' && !has) return { tokens, comment: str.slice(i) };
    if (ch === ' ' || ch === '\t') { if (has) { tokens.push(cur); cur = ''; has = false; } i++; continue; }
    cur += ch; has = true; i++;
  }
  if (has) tokens.push(cur);
  return { tokens, comment: '' };
}

function parseLine(raw, ln) {
  const indent = raw.match(/^[ \t]*/)[0];
  const t = raw.slice(indent.length).replace(/\s+$/, '');
  if (!t) return { kind: 'blank', line: ln, indent: '' };
  if (t[0] === '#') return { kind: 'comment', text: t, line: ln, indent };
  const { tokens, comment } = tokenize(t);
  const kw = (tokens[0] || '').toLowerCase();
  if (SECTIONS[kw] && (!indent || PROXY_SECS.has(kw))) {
    return { kind: 'section', type: kw, name: tokens[1] || '', tokens, comment, text: t, indent, line: ln, lines: [] };
  }
  return { kind: 'dir', kw, tokens, args: tokens.slice(1), comment, text: t, line: ln, indent };
}

function parse(text) {
  const raws = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
  const doc = { pre: [], sections: [] }; let cur = null;
  raws.forEach((raw, i) => {
    const L = parseLine(raw, i + 1);
    if (L.kind === 'section') { cur = L; doc.sections.push(L); return; }
    (cur ? cur.lines : doc.pre).push(L);
  });
  return doc;
}

function serialize(doc) {
  const out = [];
  const ln = (l, def) => l.kind === 'blank' ? '' : (l.indent ?? def) + l.text;
  doc.pre.forEach(l => out.push(ln(l, '')));
  doc.sections.forEach(s => { out.push((s.indent || '') + s.text); s.lines.forEach(l => out.push(ln(l, '    '))); });
  return out.join('\n');
}

function ensureSeparation(doc) {
  const blank = () => ({ kind: 'blank', indent: '' });
  if (doc.sections.length && doc.pre.some(l => l.kind !== 'blank') && doc.pre[doc.pre.length - 1].kind !== 'blank') doc.pre.push(blank());
  doc.sections.forEach(s => { if (!s.lines.length || s.lines[s.lines.length - 1].kind !== 'blank') s.lines.push(blank()); });
}

function rebuildHeader(s, newName) {
  const rest = s.tokens.slice(2).map(quoteTok);
  s.name = newName; s.tokens = [s.type, newName, ...s.tokens.slice(2)];
  s.text = [s.type, newName, ...rest].filter(Boolean).join(' ') + (s.comment ? ' ' + s.comment : '');
}
const quoteTok = t => (t === '' || /[\s#"'\\]/.test(t)) ? `"${t.replace(/(["\\])/g, '\\$1')}"` : t;

/* ---------- Diccionario de directivas ---------- */

/* ---------- Ayudantes de explicación ---------- */
function dur(v, defUnit = 'ms') {
  const m = /^(\d+(?:\.\d+)?)(us|ms|s|m|h|d)?$/.exec(v || '');
  if (!m) return C(v);
  if (!m[2] && !defUnit) return B(m[1]);
  const u = { us: 'µs', ms: 'ms', s: 's', m: 'min', h: 'h', d: 'días' }[m[2] || defUnit];
  return `<b>${m[1]} ${u}</b>`;
}

function addr(s) {
  if (s == null || s === '') return '<i>(sin dirección)</i>';
  let x = s, pre = '';
  const m = /^([a-z0-9]+)@(.*)$/i.exec(x);
  if (m) {
    pre = m[1].toLowerCase(); x = m[2];
    if (pre === 'unix') return `socket Unix ${C(x)}`;
    if (pre === 'abns' || pre === 'abnsz') return `socket abstracto ${C(x)}`;
    if (pre === 'fd') return `descriptor ${C(x)}`;
    if (pre === 'sockpair') return `socketpair ${C(x)}`;
  }
  if (x.startsWith('/')) return `socket Unix ${C(x)}`;
  const proto = /^quic/.test(pre) ? ' (QUIC / HTTP/3)' : /^udp/.test(pre) ? ' (UDP)' : '';
  let host = x, port = '';
  if (x.startsWith('[')) { const e = x.indexOf(']'); host = x.slice(1, e); port = x.slice(e + 2); }
  else { const i = x.lastIndexOf(':'); if (i >= 0) { host = x.slice(0, i); port = x.slice(i + 1); } }
  let h;
  if (host === '' || host === '*' || host === '0.0.0.0') h = 'todas las interfaces';
  else if (host === '::' || host === '[::]') h = 'todas las interfaces (IPv4 + IPv6)';
  else h = C(host);

function drawMapEdges() {

  body.innerHTML = `${errs ? `<div class="iss sev-error"><span>Atención</span> Hay ${errs} error(es) detectados. Revísalos antes de desplegar.</div>` : ''}<textarea class="mono big" readonly spellcheck="false"></textarea><p class="muted sm">Valida antes de recargar: <code>haproxy -c -f /etc/haproxy/haproxy.cfg</code></p>`;

  const btns = [{ label: 'Copiar', cls: 'primary', fn: () => { copyText(S.config); return false; } }];
  if (downloadsCap) btns.unshift({ label: 'Descargar', fn: async () => { try { await downloadsCap.save({ filename: 'haproxy.cfg.txt', data: S.config }); } catch (e) { if (e?.code !== 'declined') toast('No se pudo descargar en esta vista.'); } return false; } });
  else if (!inArtifact()) btns.unshift({ label: 'Descargar', fn: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([S.config], { type: 'text/plain' })); a.download = 'haproxy.cfg'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return false; } });
  modal('Exportar haproxy.cfg', body, btns, { wide: true });
};
function openHistory() {
  const body = document.createElement('div');
  const draw = () => {
    body.innerHTML = `<div class="hist-save"><input type="text" placeholder="Nombre de la versión (opcional)"><button class="btn sm primary" data-save>Guardar versión actual</button></div>` +
      (S.versions.length ? S.versions.map((v, k) => `<div class="hist"><div><b>${esc(v.label)}</b><div class="muted sm">${new Date(v.ts).toLocaleString()} · ${v.config.split('\n').length} líneas</div></div><div class="hist-b"><button class="btn sm" data-vdiff="${k}">Comparar</button><button class="btn sm" data-vrestore="${k}">Restaurar</button><button class="icon danger" data-vdel="${k}" title="Borrar">✕</button></div></div>`).join('') : '<p class="muted">Aún no hay versiones. Se guardan automáticamente antes de aplicar cambios del asistente o importar.</p>');
  };
  draw();
  body.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.save !== undefined) { saveVersion(body.querySelector('input').value.trim() || 'Guardada manualmente'); draw(); toast('Versión guardada'); }
    if (t.dataset.vdiff) { const v = S.versions[+t.dataset.vdiff]; showDiff(S.config, v.config, `Actual → «${v.label}»`, () => restore(v), 'Restaurar esta versión'); }
    if (t.dataset.vrestore) { restore(S.versions[+t.dataset.vrestore]); m.close(); }
    if (t.dataset.vdel) { S.versions.splice(+t.dataset.vdel, 1); persist(); draw(); }
  });
  const restore = v => { saveVersion('Antes de restaurar', S.config); setConfig(v.config, { source: 'restore' }); toast(`Restaurada «${v.label}»`, { label: 'Deshacer', fn: undo }); };
  const m = modal('Historial de versiones', body, [], { wide: true });
}
$('#btnHistory').onclick = openHistory;
function openSettings() {
  const st = S.settings; const body = document.createElement('div');
  body.innerHTML = `
    <label class="fld"><span>Motor del asistente</span><select data-k="provider">
      <option value="auto">Automático (Claude en claude.ai; si no, tu clave de API)</option>
      <option value="claude">Claude integrado (solo dentro de claude.ai)</option>
      <option value="api">API de Anthropic con tu clave</option></select></label>
    <p class="muted sm">Estado: ${sampleFn ? '✓ Claude integrado disponible en esta vista.' : inArtifact() ? 'Claude integrado no disponible en esta vista.' : 'Fuera de claude.ai: usa tu clave de API.'}</p>
    <label class="fld"><span>Clave de API de Anthropic</span><input type="password" data-k="apiKey" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"></label>
    <label class="fld"><span>Modelo (API)</span><select data-k="model"><option value="claude-sonnet-5-5">Claude Sonnet 5.5</option><option value="claude-opus-5-5">Claude Opus 5.5</option><option value="claude-haiku-5-5">Claude Haiku 5.5</option></select></label>
    <p class="muted sm">La clave se guarda solo en el localStorage de este navegador y se envía únicamente a api.anthropic.com. Dentro de claude.ai las peticiones externas están bloqueadas, así que la clave solo sirve si alojas esta página tú mismo.</p>
    <hr><div class="row-btns"><button class="btn sm" data-reset-example>Cargar configuración de ejemplo</button><button class="btn sm danger" data-wipe>Borrar toda la sesión</button></div>`;
  body.querySelector('[data-k="provider"]').value = st.provider; body.querySelector('[data-k="apiKey"]').value = st.apiKey; body.querySelector('[data-k="model"]').value = st.model;
  body.querySelector('[data-reset-example]').onclick = () => { saveVersion('Antes de cargar el ejemplo', S.config); setConfig(DEFAULT_CONFIG, { source: 'reset' }); m.close(); toast('Ejemplo cargado', { label: 'Deshacer', fn: undo }); };
  body.querySelector('[data-wipe]').onclick = async () => { m.close(); if (await confirmBox('Se borrarán configuración, conversación, versiones y ajustes guardados en este navegador.', 'Borrar todo', true)) { try { localStorage.removeItem(KEY); } catch { } location.reload(); } };
  const m = modal('Ajustes', body, [{ label: 'Cancelar' }, { label: 'Guardar', cls: 'primary', fn: () => { $$('[data-k]', body).forEach(el => { st[el.dataset.k] = el.value.trim(); }); persist(); updateAiStatus(); toast('Ajustes guardados'); } }]);
}
$('#btnSettings').onclick = openSettings;

/* ---------- Arranque ---------- */
(function initDatalists() {
  $('#datalists').innerHTML = Object.entries(SUGGEST).map(([t, list]) => `<datalist id="dl-${t}">${list.map(v => { const L = parseLine('    ' + v, 0); const d = L.kind === 'dir' ? describe(L, t).html.replace(/<[^>]+>/g, '') : ''; return `<option value="${esc(v)}" label="${esc(d.slice(0, 90))}"></option>`; }).join('')}</datalist>`).join('');
})();
renderProblems(); updateUndo(); updateAiStatus(); updateChatControls(); applyLayout(); Editor.render();
if (!isVisible('chat')) renderChat();

</script>
